<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Event Gigs Dashboard</title>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --card2: #202a40; --text: #e8ecf4;
    --muted: #8b96ad; --accent: #4da3ff; --green: #43a047; --blue: #1e88e5;
    --red: #ef5350; --border: #2b3650;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 24px 20px 12px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; align-items: center; }
  select, input[type=search] { background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  input[type=search] { flex: 1; min-width: 180px; }
  .toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle button { background: var(--card2); color: var(--muted); border: 0; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .toggle button.on { background: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
  th { background: var(--card2); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: var(--card2); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .b-existing { background: rgba(67,160,71,.18); color: #7ed684; }
  .b-removed { background: rgba(239,83,80,.15); color: #f19a98; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .pay { color: #7ed684; font-weight: 600; white-space: nowrap; }
  .nopay { color: var(--muted); font-weight: 400; }
  .month-head { margin: 26px 0 10px; font-size: 17px; font-weight: 700; color: var(--accent); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .cal .dow { color: var(--muted); font-size: 11px; text-transform: uppercase; text-align: center; padding: 4px 0; }
  .cell { background: var(--card); border: 1px solid var(--border); border-radius: 8px; min-height: 84px; padding: 5px; font-size: 11px; }
  .cell.empty { background: transparent; border-color: transparent; }
  .cell .d { color: var(--muted); font-weight: 700; margin-bottom: 3px; }
  .ev { border-radius: 4px; padding: 2px 5px; margin-bottom: 3px; color: #fff; font-size: 10.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { color: var(--accent); font-size: 10.5px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
  @media (max-width: 720px) { .cell { min-height: 56px; } th:nth-child(n+7), td:nth-child(n+7) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>US Event <span>Gigs Dashboard</span></h1>
  <div class="sub" id="updated">Loading…</div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search store or city…">
    <select id="month"></select>
    <select id="pref">
      <option value="">All cities</option>
      <option value="1">⭐ Preferred (Bellevue, Seattle, Kirkland)</option>
    </select>
    <select id="status">
      <option value="">All statuses</option>
      <option value="EXISTING">Existing</option>
      <option value="REMOVED">Removed</option>
    </select>
    <div class="toggle">
      <button id="btnList" class="on">List</button>
      <button id="btnCal">Calendar</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<footer>Generated from US Event Management calendar scrape · static snapshot</footer>
<script>
let GIGS = [], view = 'list';
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('data.json').then(r => r.json()).then(d => {
  GIGS = d.gigs;
  const last = GIGS.reduce((m,g) => g.lastSeen > m ? g.lastSeen : m, '');
  $('updated').textContent = `${GIGS.length} gigs · last seen data: ${last.replace('T',' ')}`;
  const months = [...new Set(GIGS.map(g => g.date.slice(0,7)))].sort();
  $('month').innerHTML = '<option value="">All months</option>' + months.map(m =>
    `<option value="${m}">${new Date(m+'-15').toLocaleString('en-US',{month:'long',year:'numeric'})}</option>`).join('');
  render();
});

['q','month','status','pref'].forEach(id => $(id).addEventListener('input', render));
$('btnList').onclick = () => { view='list'; swap(); };
$('btnCal').onclick = () => { view='cal'; swap(); };
function swap(){ $('btnList').classList.toggle('on', view==='list'); $('btnCal').classList.toggle('on', view==='cal'); render(); }

const PREFERRED_CITIES = new Set(['bellevue', 'seattle', 'kirkland']);

function filtered() {
  const q = $('q').value.toLowerCase(), m = $('month').value, s = $('status').value;
  const pref = $('pref').value === '1';
  return GIGS.filter(g =>
    (!m || g.date.startsWith(m)) && (!s || g.status === s) &&
    (!pref || PREFERRED_CITIES.has((g.city || '').toLowerCase())) &&
    (!q || (g.store + ' ' + g.city + ' ' + g.storeNum).toLowerCase().includes(q)));
}

function render() {
  const rows = filtered();
  const ex = rows.filter(g => g.status === 'EXISTING').length;
  const cities = new Set(rows.map(g => g.city)).size;
  const payValues = rows.map(g => parseFloat((g.pay || '').replace(/[^0-9.]/g, ''))).filter(v => v > 0);
  const avgPay = payValues.length ? '$' + Math.round(payValues.reduce((a,b) => a+b, 0) / payValues.length) : '—';
  $('stats').innerHTML = [
    ['Total gigs', rows.length], ['Active', ex], ['Removed', rows.length - ex], ['Cities', cities], ['Avg pay', avgPay]
  ].map(([l,n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  $('content').innerHTML = view === 'list' ? listHTML(rows) : calHTML(rows);
}

function listHTML(rows) {
  if (!rows.length) return '<p style="color:var(--muted)">No gigs match.</p>';
  return `<table><thead><tr><th>Date</th><th>Day</th><th>Time</th><th>Store</th><th>City</th><th>Pay</th><th>State</th><th>Status</th></tr></thead><tbody>` +
    rows.map(g => `<tr>
      <td>${g.date}</td><td>${g.day.slice(0,3)}</td><td>${g.time}</td>
      <td><span class="dot" style="background:${esc(g.color)||'#1e88e5'}"></span>${esc(g.store)}${g.storeNum ? ' ' + esc(g.storeNum) : ''}</td>
      <td>${esc(g.city)}</td>
      <td class="pay"${g.role || g.eventTime ? ` title="${esc(g.role)}${g.role && g.eventTime ? ' · ' : ''}${esc(g.eventTime)}"` : ''}>${esc(g.pay) || '<span class="nopay">—</span>'}</td>
      <td>${esc(g.state)}</td>
      <td><span class="badge ${g.status==='EXISTING'?'b-existing':'b-removed'}">${esc(g.status)}</span></td>
    </tr>`).join('') + '</tbody></table>';
}

function calHTML(rows) {
  if (!rows.length) return '<p style="color:var(--muted)">No gigs match.</p>';
  const byMonth = {};
  rows.forEach(g => { const m = g.date.slice(0,7); (byMonth[m] ||= []).push(g); });
  return Object.keys(byMonth).sort().map(m => {
    const gigs = byMonth[m], byDay = {};
    gigs.forEach(g => (byDay[g.date] ||= []).push(g));
    const [y, mo] = m.split('-').map(Number);
    const first = new Date(y, mo-1, 1), days = new Date(y, mo, 0).getDate();
    let cells = '<div class="cal">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) cells += '<div class="cell empty"></div>';
    for (let d = 1; d <= days; d++) {
      const key = `${m}-${String(d).padStart(2,'0')}`, evs = byDay[key] || [];
      const shown = evs.slice(0, 4);
      cells += `<div class="cell"><div class="d">${d}</div>` +
        shown.map(g => `<div class="ev" style="background:${esc(g.color)||'#1e88e5'}" title="${esc(g.time)} ${esc(g.store)} ${esc(g.storeNum)} (${esc(g.city)})${g.pay ? ' · ' + esc(g.pay) : ''}${g.role ? ' · ' + esc(g.role) : ''}">${esc(g.time.replace(':00',''))} ${esc(g.store)} ${esc(g.storeNum)}${g.pay ? ' · ' + esc(g.pay.split(' ')[0]) : ''}</div>`).join('') +
        (evs.length > 4 ? `<div class="more">+${evs.length - 4} more</div>` : '') + '</div>';
    }
    cells += '</div>';
    const label = first.toLocaleString('en-US', {month:'long', year:'numeric'});
    return `<div class="month-head">${label} · ${gigs.length} gigs</div>` + cells;
  }).join('');
}
</script>
</body>
</html>
